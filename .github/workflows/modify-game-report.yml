name: 'Automations for Report Modifications'

run-name: >-
  trigger_issue_number="${{ github.event.issue.number }}" trigger_action="${{ github.event.action }}" ${{ github.event.issue.title }}

on:
  issues:
    types: [opened, reopened, edited]

jobs:
  post-reportbot-help:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '.github/scripts/package-lock.json'

      - name: 'Install dependencies'
        working-directory: .github/scripts
        run: |
          npm ci

      - name: 'Post ReportBot help message'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node report-bot.js --intro

  parse-and-update-issue:
    runs-on: ubuntu-latest
    outputs:
      invalid_appid: ${{ steps.sync_steam_appid.outputs.invalid_appid }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '.github/scripts/package-lock.json'

      - name: 'Install dependencies'
        working-directory: .github/scripts
        run: |
          npm ci

      - name: 'Check for recent submissions'
        if: github.event.action == 'opened'
        id: rate_limit_check
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node rate-limit.js

      - name: 'Validate and sync Steam App ID'
        if: steps.rate_limit_check.outputs.rate_limited != 'true'
        id: sync_steam_appid
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node sync-steam-appid.js

      - name: 'Set Title from issue body'
        if: steps.rate_limit_check.outputs.rate_limited != 'true' && steps.sync_steam_appid.outputs.invalid_appid != 'true'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node update-issue-title.js

      - name: 'Assign to project based on app ID'
        if: steps.rate_limit_check.outputs.rate_limited != 'true' && steps.sync_steam_appid.outputs.invalid_appid != 'true'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          # Include ORG_LOGIN
          ORG_LOGIN: 'DeckSettings'
        run: |
          node assign-projects.js

      - name: 'Set labels from issue body'
        if: steps.rate_limit_check.outputs.rate_limited != 'true' && steps.sync_steam_appid.outputs.invalid_appid != 'true'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node update-issue-labels.js

  manage-report-images:
    needs: parse-and-update-issue
    if: github.actor != 'github-actions[bot]' && needs.parse-and-update-issue.outputs.invalid_appid != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '.github/scripts/package-lock.json'

      - name: 'Install dependencies'
        working-directory: .github/scripts
        run: |
          npm ci

      - name: 'Parse report images and refactor as required'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCR_API_ENDPOINT: ${{ secrets.OCR_API_ENDPOINT }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node manage-report-images.js

  check-report-for-missing-data:
    needs: [parse-and-update-issue, manage-report-images]
    if: needs.parse-and-update-issue.outputs.invalid_appid != 'true' && (needs.manage-report-images.result == 'success' || needs.manage-report-images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '.github/scripts/package-lock.json'

      - name: 'Install dependencies'
        working-directory: .github/scripts
        run: |
          npm ci

      - name: 'Check report for missing data'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node check-report-for-missing-data.js
